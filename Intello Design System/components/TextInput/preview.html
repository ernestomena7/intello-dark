<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TextInput — preview</title>
<style>body{background:var(--surface-page);margin:0;padding:16px} .lang-row{margin-bottom:24px}</style></head>
<body>
<div id="root" class="itl-root"></div>
<script>
  var I = window.Intello, h = React.createElement, F = React.Fragment;
  function both(fn) { return h(F, null, h('div', { lang: 'es', className: 'lang-row' }, fn('es')), h('div', { lang: 'en', className: 'lang-row' }, fn('en'))); }
  var T = function (es, en) { return function (l) { return l === 'es' ? es : en; }; };

  var el = both(function (l) { return h('div', { style: { maxWidth: 420, display: 'grid', gap: 12 } },
    h(I.Field, { id: 'ti-a-' + l, label: l === 'es' ? 'Empresa' : 'Company' }, h(I.TextInput, { name: 'company', placeholder: l === 'es' ? 'Nombre de tu empresa' : 'Your company name' })),
    h(I.Field, { id: 'ti-b-' + l, label: l === 'es' ? 'Teléfono' : 'Phone' }, h(I.TextInput, { name: 'phone', type: 'tel', value: '+503 0000-0000' }))); });

  ReactDOM.createRoot(document.getElementById('root')).render(el);
</script>
</body>
</html>
