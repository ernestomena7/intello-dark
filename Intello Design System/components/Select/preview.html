  var I = window.Intello, h = React.createElement, F = React.Fragment;

  var T = function (es, en) { return function (l) { return l === 'es' ? es : en; }; };

  var OPTS = { es: [{ value: 'back-office', label: 'Back office logístico' }, { value: 'tracking', label: 'Rastreo de envíos' }, { value: 'other', label: 'Otro' }], en: [{ value: 'back-office', label: 'Logistics back office' }, { value: 'tracking', label: 'Shipment tracking' }, { value: 'other', label: 'Other' }] };
  var el = both(function (l) { return h('div', { style: { maxWidth: 420 } },
    h(I.Field, { id: 'sel-' + l, label: l === 'es' ? 'Tema' : 'Topic' }, h(I.Select, { name: 'topic', options: OPTS[l], value: 'other' }))); });

  ReactDOM.createRoot(document.getElementById('root')).render(el);
