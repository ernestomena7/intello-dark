<body>
<div id="root" class="itl-root"></div>
<script>
  var I = window.Intello, h = React.createElement, F = React.Fragment;
  function both(fn) { return h(F, null, h('div', { lang: 'es', className: 'lang-row' }, fn('es')), h('div', { lang: 'en', className: 'lang-row' }, fn('en'))); }
  var T = function (es, en) { return function (l) { return l === 'es' ? es : en; }; };

  var COPY = { es: [{ id: 'q1', question: '¿Con qué empresas trabajan?', answer: ['Con couriers, operadores 3PL y empresas de carga.'] }, { id: 'q2', question: '¿Cómo empezamos?', answer: ['Solicita una demo.', 'Te contactamos para entender tu operación.'] }, { id: 'q3', question: '¿Cómo cuidan los datos?', answer: 'Solo usamos los datos para prestar el servicio.' }],
    en: [{ id: 'q1', question: 'Which companies do you work with?', answer: ['Couriers, 3PL operators and freight companies.'] }, { id: 'q2', question: 'How do we start?', answer: ['Request a demo.', 'We get in touch to understand your operation.'] }, { id: 'q3', question: 'How do you protect data?', answer: 'We only use data to deliver the service.' }] };
  var el = both(function (l) { return h(I.Accordion, { items: COPY[l] }); });
  setTimeout(function () { var d = document.querySelector('details'); if (d) d.open = true; }, 0);

  ReactDOM.createRoot(document.getElementById('root')).render(el);
</script>
