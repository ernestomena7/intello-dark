  html, body { margin:0; height:100%; }

  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; inset:0; }
  .deep { fill:var(--navy); }
  .brand { fill:var(--yellow); }
  .accent { fill:var(--blue); }
  .tint { fill:var(--surface-paper); }
  .dot { fill:var(--blue); }
  .pin { fill:var(--yellow); }
  [data-theme="dark"] .deep { fill:var(--surface-card); }
  [data-theme="dark"] .tint { fill:var(--blue); }
  [data-theme="dark"] .accent { fill:var(--surface-paper); }
  .slab { rx:var(--radius-xl); }
  .card { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:104px; line-height:.92; font-weight:700; letter-spacing:-0.03em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
