<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SkipLink — preview</title>
<style>body{background:var(--surface-page);margin:0;padding:16px} .lang-row{margin-bottom:24px}</style></head>
<body>
<div id="root" class="itl-root"></div>
<script>
  var I = window.Intello, h = React.createElement, F = React.Fragment;
  function both(fn) { return h(F, null, h('div', { lang: 'es', className: 'lang-row' }, fn('es')), h('div', { lang: 'en', className: 'lang-row' }, fn('en'))); }
  var T = function (es, en) { return function (l) { return l === 'es' ? es : en; }; };

  var el = both(function (l) { return h('div', null, h('p', null, l === 'es' ? 'Se muestra al recibir el foco (Tab). Aquí se fuerza visible:' : 'Shown when it receives focus (Tab). Forced visible here:'),
    h(I.SkipLink, { href: '#main' }, l === 'es' ? 'Saltar al contenido' : 'Skip to content')); });
  setTimeout(function () { document.querySelectorAll('.itl-skip').forEach(function (a) { a.style.transform = 'none'; a.style.position = 'static'; a.style.display = 'inline-block'; }); }, 0);

  ReactDOM.createRoot(document.getElementById('root')).render(el);
</script>
</body>
</html>
